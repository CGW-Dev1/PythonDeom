{% extends "base.html" %}

{% block title %}注册 - 房租数据分析系统{% endblock %}

{% block content %}
<section class="auth-shell">
    <form class="auth-form" method="post">
        <h1>用户注册</h1>
        <label>
            用户名
            <input name="username" minlength="3" autocomplete="username" required>
        </label>
        <label>
            密码
            <input name="password" type="password" minlength="6" autocomplete="new-password" required>
        </label>
        <label>
            确认密码
            <input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required>
        </label>
        <button class="btn full" type="submit">注册</button>
        <p class="subtle">已有账号？<a href="{{ url_for('main.login') }}">去登录</a></p>
    </form>
</section>
{% endblock %}
