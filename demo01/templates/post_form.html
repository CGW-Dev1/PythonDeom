{% extends "base.html" %}

{% block title %}{{ action }} - PyBlog 园地{% endblock %}

{% block content %}
<section class="admin-heading">
    <div>
        <p class="eyebrow">Editor</p>
        <h1>{{ action }}</h1>
    </div>
    <a class="button" href="{{ url_for('dashboard') }}">返回后台</a>
</section>

<form class="editor" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <label>
            标题
            <input name="title" value="{{ post.title }}" required>
        </label>
        <label>
            分类
            <select name="category_id">
                <option value="">未分类</option>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if post.category_id|string == category.id|string %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <label>
        摘要
        <textarea name="summary" rows="3">{{ post.summary }}</textarea>
    </label>
    <label>
        正文
        <textarea name="content" rows="16" required>{{ post.content }}</textarea>
    </label>
    <label>
        标签
        <input name="tags" value="{{ post.tags }}" placeholder="Python, Flask, MySQL">
    </label>
    <div class="switch-row">
        <label class="checkbox-line">
            <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}>
            发布文章
        </label>
        <label class="checkbox-line">
            <input type="checkbox" name="is_featured" {% if post.is_featured %}checked{% endif %}>
            标记精华
        </label>
    </div>
    <div class="form-actions">
        <button class="button primary" type="submit">保存</button>
        <a class="button" href="{{ url_for('dashboard') }}">取消</a>
    </div>
</form>
{% endblock %}
