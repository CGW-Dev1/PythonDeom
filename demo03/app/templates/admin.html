<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统后台 - 二手房数据大屏</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="admin-body">
    <header class="topbar">
        <div class="title-block">
            <div class="eyebrow">Administration</div>
            <h1>系统后台</h1>
        </div>
        <div class="top-actions">
            <span class="user-chip">{{ user.username }} · 管理员</span>
            <a class="ghost-button" href="{{ url_for('pages.dashboard') }}">返回大屏</a>
            <a class="ghost-button" href="{{ url_for('auth.logout') }}">退出</a>
        </div>
    </header>

    <main class="admin-grid">
        <section class="panel admin-panel">
            <div class="panel-head"><h2>数据导入</h2></div>
            <form id="importForm" class="admin-form">
                <label>
                    <span>数据来源</span>
                    <input name="source_name" value="CSV导入">
                </label>
                <label>
                    <span>CSV 文件</span>
                    <input name="file" type="file" accept=".csv" required>
                </label>
                <button class="primary-button" type="submit">上传导入</button>
            </form>
            <div id="importResult" class="result-text"></div>
        </section>

        <section class="panel admin-panel">
            <div class="panel-head"><h2>演示数据</h2></div>
            <form id="seedForm" class="admin-form inline-form">
                <label>
                    <span>生成数量</span>
                    <input name="total" type="number" min="100" max="10000" value="1600">
                </label>
                <button class="primary-button" type="submit">生成/更新</button>
            </form>
            <div class="result-text">用于开发、测试和验收演示，不代表真实市场价格。</div>
        </section>

        <section class="panel admin-panel wide-admin">
            <div class="panel-head"><h2>合规数据源配置</h2></div>
            <form id="sourceForm" class="admin-form source-form">
                <input name="name" placeholder="数据源名称" required>
                <select name="source_type">
                    <option value="csv">CSV 文件</option>
                    <option value="api">授权 API</option>
                    <option value="official">政府/统计公开数据</option>
                </select>
                <input name="url" placeholder="公开链接或接口地址">
                <input name="compliance_note" placeholder="授权说明 / 合规备注">
                <button class="primary-button" type="submit">保存</button>
            </form>
            <div class="table-wrap compact">
                <table>
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>类型</th>
                            <th>地址</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </section>

        <section class="panel admin-panel wide-admin">
            <div class="panel-head"><h2>数据维护</h2></div>
            <div class="maintenance-bar">
                <input id="adminKeyword" type="search" placeholder="搜索小区 / 区域 / 板块">
                <button id="adminSearch" class="primary-button">查询</button>
            </div>
            <div class="table-wrap compact">
                <table>
                    <thead>
                        <tr>
                            <th>城市</th>
                            <th>区域</th>
                            <th>小区</th>
                            <th>户型</th>
                            <th>总价</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminListingBody"></tbody>
                </table>
            </div>
        </section>

        <section class="panel admin-panel wide-admin">
            <div class="panel-head"><h2>日志</h2></div>
            <div class="log-grid">
                <div>
                    <h3>导入日志</h3>
                    <div id="importLogs" class="log-list"></div>
                </div>
                <div>
                    <h3>操作日志</h3>
                    <div id="operationLogs" class="log-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
